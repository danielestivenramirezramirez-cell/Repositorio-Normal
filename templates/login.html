{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card card-custom p-4 shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="institutional-identity justify-content-center mb-3">
                    <img src="{{ url_for('static', filename='images/escudo-institucional.png') }}" alt="Escudo de la Escuela Normal Superior Claudina Múnera" class="identity-crest">
                    <img src="{{ url_for('static', filename='images/mascota-normalista.png') }}" alt="Mascota normalista ENSCM" class="identity-mascot">
                </div>
                <i class="bi bi-shield-lock-fill text-primary display-4"></i>
                <h3 class="fw-bold mt-2 text-dark">Acceso al Repositorio</h3>
                <p class="text-muted small">Escuela Normal Superior Claudina Múnera</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Usuario Institucional</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-fill text-muted"></i></span>
                        <input type="text" name="usuario" class="form-control" placeholder="Nombre de usuario" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small text-muted">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key-fill text-muted"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-enscm-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
